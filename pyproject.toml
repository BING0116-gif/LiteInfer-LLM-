[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "liteinfer"
version = "0.1.0"
description = "LiteInfer - 单卡高吞吐 LLM 推理与服务引擎（mini-vLLM）"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0",
    "transformers>=4.40",
    "psutil>=5.9",
    "numpy>=1.24",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
]

[tool.setuptools.packages.find]
include = ["liteinfer*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# 默认只跑不依赖真实模型的快速测试；需要模型的用 `pytest -m model` 显式触发
addopts = "-m 'not model'"
markers = [
    "model: 需要下载/加载真实模型（慢，需要 hf_cache 就绪）",
    "slow: 长耗时测试",
]
