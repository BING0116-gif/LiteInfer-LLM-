[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "liteinfer"
version = "0.1.0"
description = "LiteInfer - 单卡高吞吐 LLM 推理与服务引擎（mini-vLLM）"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0",
    "transformers>=4.40",
    "psutil>=5.9",
    "numpy>=1.24",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
    # Task 09 起：服务层与流式 API 的测试需要 Web 栈与 asyncio 测试插件
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "httpx>=0.27",
    "pytest-asyncio>=0.23",
]
serving = [
    "fastapi>=0.110",
    "uvicorn>=0.27",
]

[tool.setuptools.packages.find]
include = ["liteinfer*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# 默认只跑不依赖真实模型的快速测试；需要模型的用 `pytest -m model` 显式触发
addopts = "-m 'not model'"
markers = [
    "model: 需要下载/加载真实模型（慢，需要 hf_cache 就绪）",
    "slow: 长耗时测试",
]
# Task 09：AsyncEngine 的测试是 async def，用 auto 模式省掉逐个加 marker 的噪音
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
